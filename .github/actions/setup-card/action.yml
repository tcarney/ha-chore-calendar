name: "Set up card environment"
description: "Install Node (version from card/.nvmrc) and the card's locked npm dependencies. The repository must already be checked out."

runs:
  using: "composite"
  steps:
    - name: Set up Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: "card/.nvmrc"
        cache: "npm"
        cache-dependency-path: "card/package-lock.json"

    # npm ci installs exactly what the lockfile pins (script/card/bootstrap
    # runs npm install, which can rewrite it).
    - name: Install card dependencies
      shell: bash
      working-directory: card
      run: npm ci
