name: test

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

permissions: {}

# Cancel a superseded run when a pull request gets a new push. Runs on main
# always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-check:
    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Home Assistant environment
        uses: ./.github/actions/setup-ha

      - name: Lint check
        run: script/lint-check

  type-check:
    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Home Assistant environment
        uses: ./.github/actions/setup-ha

      - name: Type check
        run: script/type-check

  spell-check:
    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Home Assistant environment
        uses: ./.github/actions/setup-ha

      - name: Spell check
        run: script/spell-check

  tests:
    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Home Assistant environment
        uses: ./.github/actions/setup-ha

      - name: Run tests
        run: script/test

  card-test:
    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up card environment
        uses: ./.github/actions/setup-card

      - name: Run card tests
        run: script/card/test
