name: card

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

permissions:
  contents: write

jobs:
  build:
    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # On pull requests, check out the PR head commit (not the merge ref)
          # by SHA. A SHA resolves for fork PRs too, whose branch name does not
          # exist in this repo. The commit step later switches to the head
          # branch to push a rebuilt bundle. On push events, this is the
          # pushed commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # Full history, so the bundle-input author lookup (git log on the
          # card sources) finds the last commit that touched them, not only
          # the tip.
          fetch-depth: 0

      # On pull requests from this repo, rebuild and commit the bundle if it
      # drifted from source (no more "forgot to rebuild" CI failures). Fork
      # PRs get a read-only token and their branch does not exist here, so
      # they verify only, like main: the contributor commits the rebuilt bundle.
      - name: Build card
        uses: ./.github/actions/build-card
        with:
          commit: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
